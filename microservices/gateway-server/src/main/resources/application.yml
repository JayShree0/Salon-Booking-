spring:
  application:
    name: gateway-server

  cloud:
    gateway:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST
      discovery:
        locator:
          enabled: true

      routes:
        - id: booking-service
          uri: lb://BOOKING-SERVICE
          predicates:
            - Path=/api/bookings/**

        - id: payment-service
          uri: lb://PAYMENT-SERVICE
          predicates:
            - Path=/api/payments/**

        - id: category-service
          uri: lb://CATEGORY-SERVICE
          predicates:
            - Path=/api/categories/**

        - id: notification-service
          uri: lb://NOTIFICATION-SERVICE
          predicates:
            - Path=/api/notifications/**,/api/notifications/user/**

        - id: salon-service
          uri: lb://SALON-SERVICE
          predicates:
            - Path=/salons/**,/api/salons/**,/api/admin/salons/**

        - id: service-offering
          uri: lb://SERVICE-OFFERING
          predicates:
            - Path=/api/service-offering/**

        # ADDED: Route frontend review requests to the existing review service.
        - id: review-service
          uri: lb://REVIEW-SERVICE
          predicates:
            - Path=/api/reviews/**

        - id: user-service
          uri: lb://USER-SERVICE
          predicates:
            - Path=/auth/**,/api/auth/**,/api/admin/users/**,/api/users/**,/users/**

jwt:
  secret: ${JWT_SECRET:SalonBookingSecretKeyForJwtTokenSigningAndValidation2026WithMinimum256BitsLength}


server:
  port: 5000


eureka:
  instance:
    prefer-ip-address: true

  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone: http://localhost:8070/eureka/