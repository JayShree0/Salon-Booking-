spring:
  application:
    name: gateway-server

  cloud:
    gateway:
      discovery:
        locator:
          enabled: true

      routes:
        - id: booking-service
          uri: "lb://BOOKING-SERVICE"
          predicates:
            - Path=/api/bookings/**

        - id: payment-service
          uri: "lb://PAYMENT-SERVICE"
          predicates:
            - Path=/api/payments/**

        - id: category-service
          uri: "lb://CATEGORY-SERVICE"
          predicates:
            - Path=/api/categories/**

        - id: salon-service
          uri: "lb://SALON-SERVICE"
          predicates:
            - Path=/salons/**,/api/salons/**,/api/admin/salons/**

        - id: service-offering
          uri: "lb://SERVICE-OFFERING"
          predicates:
            - Path=/api/service-offering/**

        - id: user-service
          uri: "lb://USER-SERVICE"
          predicates:
            - Path=/auth/**,/api/admin/users/**,/api/users/**,/users/**

server:
  port: 5000

eureka:
  instance:
    prefer-ip-address: true

  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone: http://localhost:8070/eureka/